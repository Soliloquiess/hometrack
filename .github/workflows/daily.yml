# hometrack 매일 수집 → 빌드 → 커밋 → GitHub Pages 배포
#
# cron 은 UTC 다. `0 22 * * *` = 매일 07:00 KST.
# Actions 러너 혼잡 시 수십 분 지연이 흔하므로 화면의 "N시간 전" 은 스케줄이 아니라
# meta.generated_at 실측값으로만 계산한다 (SPEC §3-5).
#
# 🔴 이 저장소는 공개다. Actions 로그와 커밋된 JSON 이 둘 다 공개이므로
#    키가 로그에 찍히지 않아야 한다 (D7). 여기서는 `set +x` 로 명령 에코를 끄고,
#    에러 문자열 마스킹은 collect.py 의 mask_secret() 이 담당한다.

name: daily

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hometrack-daily
  cancel-in-progress: false

jobs:
  collect-build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        # diff 의 비교 기준은 git 히스토리가 아니라 커밋된 data/notices_prev.json 이다.
        # 러너는 매회 새 체크아웃이므로 그 파일이 저장소에 있어야 한다 (SPEC §3-6).

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # pip 의존성 없음 — 표준 라이브러리만 쓴다 (CLAUDE.md §3)

      - name: 수집 · 빌드
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +x
          set -euo pipefail
          python collect.py && python build.py

      - name: 키 유출 검사
        run: |
          set +x
          if grep -rniE 'servicekey' data/ site/ 2>/dev/null; then
            echo "::error::산출물에 인증키 패턴이 있다 (D7 · Q42)"
            exit 1
          fi
          echo "키 패턴 0건"

      - name: 변경 있으면 커밋
        run: |
          set +x
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 자동 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
